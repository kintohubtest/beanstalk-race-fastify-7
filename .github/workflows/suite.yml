name: suite
on:
  pull_request:
  merge_group:
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25.8.1"
      - name: install
        run: mkdir -p "$RUNNER_TEMP/deps" && cp .github/race/package.json .github/race/package-lock.json "$RUNNER_TEMP/deps/" && (cd "$RUNNER_TEMP/deps" && npm ci --no-audit --no-fund --ignore-scripts) && ln -sfn "$RUNNER_TEMP/deps/node_modules" node_modules
      - name: suite
        run: node --no-use-env-proxy --test --test-timeout=60000 --test-reporter=spec --test-reporter-destination=stdout 'test/!(listen.5).test.js' 'test/*/**/*.test.js' 'test/**/*.test.mjs'
        env:
          CI: "1"
